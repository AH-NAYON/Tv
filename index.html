        {"name":"Sony Sports 1","id":"sonysports","url":"https://d3kdywbtdfbp9z.cloudfront.net/v1/manifest/93ce20f0f52760bf38be911ff4c91ed02aa2fd92/dff423e0-3c82-46d6-9ecb-3baa96b5694a/4598c408-0e38-488c-9b64-fc845d1ea2b6/0.m3u8","cat":"স্পোর্টস"},
        {"name":"Cricket Zone HD","id":"criczone","url":"https://owrcovcrpy.gpcdn.net/bpk-tv/1700/output/index.m3u8","cat":"স্পোর্টs"},
        {"name":"SA TV News","id":"satvnews","url":"https://owrcovcrpy.gpcdn.net/bpk-tv/1720/output/index.m3u8","cat":"নিউজ"}
    ];

    // Dummy channels for search
    const extraCount = 90;
    const cats = ["স্পোর্টস", "নিউজ", "বিনোদন"];
    const extraChannels = [];
    for (let i = 1; i <= extraCount; i++) {
        const cat = cats[i % cats.length];
        let name = "";
        if (cat === "স্পোর্টস") name = `স্পোর্টস চ্যানেল ${i}`;
        else if (cat === "নিউজ") name = `নিউজ টিভি ${i}`;
        else name = `বিনোদন এইচডি ${i}`;
        extraChannels.push({ name: name, id: `extra_${i}`, url: "", cat: cat });
    }
    const allChannelsForSearch = [...realChannels, ...extraChannels];

    function getIconClass(cat) {
        if(cat === 'স্পোর্টস') return 'fa-futbol';
        if(cat === 'নিউজ') return 'fa-newspaper';
        return 'fa-film';
    }

    // AVAILABLE VIEW
    let hlsInstance = null;
    let activeChannel = realChannels[0];
    const video = document.getElementById('mainVideo');
    const placeholderDiv = document.getElementById('videoPlaceholder');
    const spinner = document.getElementById('loaderSpinner');
    const currentTitle = document.getElementById('currentChannelTitle');
    const currentCatSpan = document.getElementById('currentChannelCat');
    const availableGrid = document.getElementById('availableChannelsGrid');

    function playChannel(channel) {
        if (!channel) return;
        activeChannel = channel;
        currentTitle.innerText = channel.name;
        currentCatSpan.innerText = channel.cat;
        if (hlsInstance) hlsInstance.destroy();
        spinner.style.display = 'block';
        placeholderDiv.style.display = 'flex';
        video.pause();
        if (Hls.isSupported()) {
            const hls = new Hls({ enableWorker: true });
            hls.loadSource(channel.url);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => {
                spinner.style.display = 'none';
                placeholderDiv.style.display = 'none';
                video.play().catch(e => console.warn);
            });
            hls.on(Hls.Events.ERROR, (_, data) => {
                if (data.fatal) {
                    spinner.style.display = 'none';
                    placeholderDiv.innerHTML = '<i class="fas fa-exclamation-triangle"></i> স্ট্রিম লোড হয়নি';
                    placeholderDiv.style.display = 'flex';
                }
            });
            hlsInstance = hls;
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = channel.url;
            video.addEventListener('loadedmetadata', () => {
                spinner.style.display = 'none';
                placeholderDiv.style.display = 'none';
                video.play();
            }, { once: true });
        } else {
            spinner.style.display = 'none';
            placeholderDiv.innerHTML = 'HLS সমর্থিত নয়';
            placeholderDiv.style.display = 'flex';
        }
        renderAvailableGrid();
    }

    function renderAvailableGrid() {
        let html = '';
        realChannels.forEach(ch => {
            html += `<div class="channel-card ${activeChannel.id === ch.id ? 'active' : ''}" data-id="${ch.id}">
                        <div class="channel-icon-small"><i class="fas ${getIconClass(ch.cat)}"></i></div>
                        <div><h4>${ch.name}</h4><span>${ch.cat}</span></div>
                        <div class="live-dot-small"></div>
                    </div>`;
        });
        availableGrid.innerHTML = html;
        document.querySelectorAll('#availableChannelsGrid .channel-card').forEach(el => {
            el.addEventListener('click', () => {
                const id = el.getAttribute('data-id');
                const selected = realChannels.find(c => c.id === id);
                if (selected) playChannel(selected);
            });
        });
    }

    // SEARCH VIEW
    const searchInput = document.getElementById('searchInput');
    const searchResultsDiv = document.getElementById('searchResultsList');

    function renderSearchResults(query) {
        const filtered = allChannelsForSearch.filter(ch => ch.name.toLowerCase().includes(query.toLowerCase()));
        if (filtered.length === 0) {
            searchResultsDiv.innerHTML = '<div style="padding:20px;text-align:center">কোন চ্যানেল পাওয়া যায়নি</div>';
            return;
        }
        let html = '';
        filtered.forEach(ch => {
            html += `<div class="result-item" data-name="${ch.name}" data-id="${ch.id}"><i class="fas ${getIconClass(ch.cat)}"></i><span>${ch.name}</span><span style="margin-left:auto;font-size:11px;color:#8a75b2;">${ch.cat}</span></div>`;
        });
        searchResultsDiv.innerHTML = html;
        document.querySelectorAll('#searchResultsList .result-item').forEach(el => {
            el.addEventListener('click', () => {
                const name = el.getAttribute('data-name');
                const realChannel = realChannels.find(rc => rc.name === name);
                if (realChannel) {
                    playChannel(realChannel);
                    switchView('available');
                } else {
                    showComingSoonModal(name);
                }
            });
        });
    }
    searchInput.addEventListener('input', (e) => renderSearchResults(e.target.value));
    renderSearchResults('');

    // MODAL
    const modal = document.getElementById('comingSoonModal');
    const modalChannelSpan = document.getElementById('modalChannelName');
    function showComingSoonModal(channelName) {
        modalChannelSpan.innerText = channelName;
        modal.style.display = 'flex';
    }
    function closeModal() { modal.style.display = 'none'; }
    document.getElementById('closeModalBtn').addEventListener('click', closeModal);
    window.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });

    // BOTTOM NAVIGATION
    const views = {
        available: document.getElementById('availableView'),
        search: document.getElementById('searchView'),
        upcoming: document.getElementById('upcomingView')
    };
    const navBtns = document.querySelectorAll('.nav-btn');
    function switchView(viewName) {
        Object.keys(views).forEach(v => views[v].classList.remove('active-view'));
        views[viewName].classList.add('active-view');
        navBtns.forEach(btn => {
            if (btn.getAttribute('data-view') === viewName) btn.classList.add('active');
            else btn.classList.remove('active');
        });
        if (viewName !== 'available' && hlsInstance) video.pause();
        else if (viewName === 'available' && activeChannel) video.play().catch(e => console.log);
    }
    navBtns.forEach(btn => btn.addEventListener('click', () => switchView(btn.getAttribute('data-view'))));

    // Initialize
    renderAvailableGrid();
    playChannel(realChannels[0]);
</script>
</body>
</html>
