    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: #f7f5fe;
            color: #171223;
            padding-bottom: 100px;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .app-container {
            max-width: 700px;
            margin: 0 auto;
            padding: 0 16px 24px;
        }
        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0 8px;
            border-bottom: 1px solid #e7e0f5;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .logo i {
            font-size: 26px;
            color: #2e2352;
        }
        .logo h1 {
            font-size: 1.4rem;
            font-weight: 800;
            background: linear-gradient(135deg, #2e2352, #725cb0);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .badge {
            background: #100e1c;
            color: white;
            padding: 4px 10px;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 600;
        }
        .install-btn {
            background: #0c4e6e;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 40px;
            font-size: 12px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: 0.2s;
        }
        .install-btn:hover {
            background: #083c55;
        }
        .view {
            display: none;
            animation: fade 0.25s ease;
        }
        .view.active-view {
            display: block;
        }
        @keyframes fade {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .player-card {
            background: #0b0718;
            border-radius: 28px;
            overflow: hidden;
            margin-bottom: 16px;
            box-shadow: 0 20px 30px -12px rgba(0, 0, 0, 0.3);
        }
        .video-wrapper {
            position: relative;
            width: 100%;
            background: #000;
            aspect-ratio: 16/9;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }
        .video-placeholder {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #120d22;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            gap: 12px;
            pointer-events: none;
        }
        .player-info {
            background: white;
            padding: 14px 20px;
        }
        .live-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #ffe6ec;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 10px;
            font-weight: 800;
            color: #e11d48;
            margin-bottom: 6px;
        }
        .live-dot {
            width: 8px;
            height: 8px;
            background: #e11d48;
            border-radius: 50%;
            animation: pulse 1.2s infinite;
        }
        @keyframes pulse {
            0% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }
        .current-channel-name {
            font-size: 20px;
            font-weight: 800;
            color: #0e0a1c;
        }
        .category-tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 8px 0;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            flex-wrap: nowrap;
            scrollbar-width: none;
        }
        .category-tabs::-webkit-scrollbar {
            display: none;
        }
        .cat-tab {
            flex-shrink: 0;
            padding: 8px 16px;
            border-radius: 40px;
            border: 1px solid #ddd2ef;
            background: white;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
            color: #5c4d78;
        }
        .cat-tab.active {
            background: #2e2352;
            color: white;
            border-color: #2e2352;
        }
        .cat-tab .cat-count {
            font-size: 10px;
            opacity: 0.7;
            margin-left: 4px;
        }
        .channels-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
            max-height: 480px;
            overflow-y: auto;
            padding: 8px 0;
            scroll-behavior: smooth;
        }
        .channel-card {
            background: white;
            border-radius: 20px;
            padding: 10px 8px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid #e8e0f7;
            position: relative;
            overflow: hidden;
        }
        .channel-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(46, 35, 82, 0.1);
        }
        .channel-card.active {
            background: #e8defc;
            border-color: #b59cdb;
            box-shadow: 0 4px 15px rgba(46, 35, 82, 0.12);
        }
        .channel-icon-small {
            width: 38px;
            height: 38px;
            background: #1f1935;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 16px;
            flex-shrink: 0;
            overflow: hidden;
        }
        .channel-icon-small img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .channel-card h4 {
            font-size: 12px;
            font-weight: 700;
            line-height: 1.3;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 90px;
        }
        .channel-card span {
            font-size: 10px;
            color: #6b558f;
        }
        .live-dot-small {
            width: 8px;
            height: 8px;
            background: #44b584;
            border-radius: 50%;
            margin-left: auto;
            flex-shrink: 0;
        }
        .channel-card.active .live-dot-small {
            background: #e11d48;
            box-shadow: 0 0 0 2px #ffcdd8;
        }
        .search-area {
            background: white;
            border-radius: 28px;
            padding: 16px;
            margin-top: 8px;
            border: 1px solid #e8e0f5;
        }
        .search-box {
            position: relative;
            margin-bottom: 16px;
        }
        .search-box input {
            width: 100%;
            padding: 14px 18px 14px 44px;
            border-radius: 60px;
            border: 1px solid #ddd2ef;
            font-size: 15px;
            background: #fffbfe;
            outline: none;
        }
        .search-box i {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #9a86c9;
            font-size: 16px;
        }
        .search-results {
            max-height: 500px;
            overflow-y: auto;
        }
        .result-item {
            padding: 12px 14px;
            border-bottom: 1px solid #efeaff;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.1s;
            border-radius: 12px;
        }
        .result-item:hover {
            background: #faf5ff;
        }
        .result-item i {
            width: 28px;
            color: #624f8a;
            text-align: center;
        }
        .result-item img {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            object-fit: cover;
        }
        .sports-header {
            background: white;
            border-radius: 28px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid #e8e0f5;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .sports-header i {
            font-size: 32px;
            color: #2e2352;
        }
        .sports-header h2 {
            font-size: 20px;
            font-weight: 800;
            color: #000;
        }
        .sports-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
            max-height: 600px;
            overflow-y: auto;
            padding: 8px 0;
        }
        .main-footer {
            margin-top: 36px;
            text-align: center;
            padding: 16px 0 10px;
            border-top: 1px solid #e2d9f0;
        }
        .footer-watermark {
            font-size: 13px;
            font-weight: 600;
            color: #5c4d78;
            margin-bottom: 10px;
        }
        .contact-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #000000;
            color: white;
            padding: 8px 20px;
            border-radius: 40px;
            text-decoration: none;
            font-weight: 600;
            font-size: 13px;
            transition: 0.2s;
        }
        .contact-btn:hover {
            background: #2b2350;
        }
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(12px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 6px 16px 20px;
            border-top: 1px solid #e2d9f0;
            z-index: 1000;
        }
        .nav-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            font-weight: 600;
            color: #928bb0;
            background: none;
            border: none;
            cursor: pointer;
            transition: 0.2s;
        }
        .nav-btn i {
            font-size: 24px;
        }
        .nav-btn.active {
            color: #000000;
            transform: translateY(-2px);
        }
        .nav-btn span {
            font-size: 10px;
        }
        .spinner {
            width: 30px;
            height: 30px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        @media (max-width: 480px) {
            .channels-grid,
            .sports-grid {
                grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
                gap: 8px;
                max-height: 400px;
            }
            .channel-card {
                padding: 8px 6px;
                gap: 8px;
            }
            .channel-icon-small {
                width: 34px;
                height: 34px;
                font-size: 14px;
            }
            .channel-card h4 {
                font-size: 11px;
                max-width: 75px;
            }
            .cat-tab {
                padding: 6px 12px;
                font-size: 11px;
            }
            .player-card {
                border-radius: 22px;
            }
            .player-info {
                padding: 10px 14px;
            }
            .current-channel-name {
                font-size: 17px;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="app-header">
            <div class="logo">
                <i class="fas fa-tv"></i>
                <h1>LIVE TV</h1>
            </div>
            <div style="display: flex; gap: 8px; align-items: center;">
                <div class="badge"><i class="fas fa-satellite-dish"></i> <span id="totalChannelCount">160+</span> চ্যানেল</div>
                <button id="installAppBtn" class="install-btn" style="display: none;"><i class="fas fa-download"></i> অ্যাপ ইনস্টল</button>
            </div>
        </div>

        <!-- AVAILABLE CHANNELS VIEW -->
        <div id="availableView" class="view active-view">
            <div class="player-card">
                <div class="video-wrapper">
                    <video id="mainVideo" controls autoplay playsinline></video>
                    <div id="videoPlaceholder" class="video-placeholder">
                        <i class="fas fa-tv" style="font-size: 36px;"></i>
                        <h3>একটি চ্যানেল নির্বাচন করুন</h3>
                        <div id="loaderSpinner" class="spinner"></div>
                    </div>
                </div>
                <div class="player-info">
                    <div class="live-badge"><div class="live-dot"></div> লাইভ স্ট্রিমিং</div>
                    <div class="current-channel-name" id="currentChannelTitle">—</div>
                    <div style="font-size: 12px; margin-top: 4px; color:#7a64a5;" id="currentChannelCat"></div>
                </div>
            </div>
            <div class="category-tabs" id="categoryTabs"></div>
            <div class="channels-grid" id="availableChannelsGrid"></div>
        </div>

        <!-- SEARCH VIEW -->
        <div id="searchView" class="view">
            <div class="search-area">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" placeholder="চ্যানেলের নাম লিখুন...">
                </div>
                <div class="search-results" id="searchResultsList"></div>
            </div>
        </div>

        <!-- SPORTS VIEW (replaces World Cup) -->
        <div id="upcomingView" class="view">
            <div class="sports-header">
                <i class="fas fa-futbol"></i>
                <h2>স্পোর্টস টিভি</h2>
            </div>
            <div class="sports-grid" id="sportsChannelsGrid"></div>
        </div>

        <div class="main-footer">
            <div class="footer-watermark">সুইট বয় নয়ন</div>
            <a href="https://ah-nayon.github.io/web/" target="_blank" rel="noopener noreferrer" class="contact-btn">
                <i class="fas fa-envelope"></i> যোগাযোগ
            </a>
        </div>
    </div>

    <!-- Modal -->
    <div id="comingSoonModal" class="modal">
        <div class="modal-card">
            <i class=""></i>
            <h3></h3>
            <p id="modalChannelName" style="margin:6px 0;font-weight:600;"></p>
            <p></p>
            <button class="modal-close" id="closeModalBtn"></button>
        </div>
    </div>

    <div class="bottom-nav">
        <button class="nav-btn active" data-view="available"><i class="fas fa-list-ul"></i><span>Tv Channels</span></button>
        <button class="nav-btn" data-view="search"><i class="fas fa-search"></i><span>Find Channels</span></button>
        <button class="nav-btn" data-view="upcoming"><i class="fas fa-futbol"></i><span>Sports</span></button>
    </div>

    <script>
        (function() {
            const manifest = {
                name: "LIVE TV - লাইভ স্ট্রিমিং",
                short_name: "LIVE TV",
                description: "বাংলাদেশের লাইভ টিভি চ্যানেল এক জায়গায়",
                start_url: "/web/",
                display: "standalone",
                theme_color: "#2e2352",
                background_color: "#f7f5fe",
                icons: [{ src: "television.png", sizes: "512x512", type: "image/png", purpose: "any maskable" }]
            };
            const manifestBlob = new Blob([JSON.stringify(manifest)], { type: "application/json" });
            const manifestURL = URL.createObjectURL(manifestBlob);
            const manifestLink = document.createElement('link');
            manifestLink.rel = 'manifest';
            manifestLink.href = manifestURL;
            document.head.appendChild(manifestLink);

            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('/sw.js').catch(() => {});
                const swCode =
                    `self.addEventListener('fetch', event => { event.respondWith(fetch(event.request).catch(() => caches.match(event.request).then(resp => resp || new Response('Offline')))); });`;
                const swBlob = new Blob([swCode], { type: 'application/javascript' });
                const swURL = URL.createObjectURL(swBlob);
                navigator.serviceWorker.register(swURL).catch(() => {});
            }
        })();

            e.preventDefault();
            deferredPrompt = e;
            installBtn.style.display = 'inline-flex';
        });
        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') installBtn.style.display = 'none';
                deferredPrompt = null;
            }
        });

        const groupMap = {

        const groupedChannels = {};
        allChannels.forEach(ch => {
            const g = ch.group || "Others";
            if (!groupedChannels[g]) groupedChannels[g] = [];
            groupedChannels[g].push(ch);
        });

        const sortedGroups = Object.keys(groupedChannels).sort((a, b) => {
            const oa = groupMap[a]?.order || 99;
            const ob = groupMap[b]?.order || 99;
            return oa - ob;
        });

        document.getElementById('totalChannelCount').innerText = allChannels.length + '+';

        // ======================= HLS PLAYER =======================
        let hlsInstance = null;
        let activeChannel = allChannels[0];
        const video = document.getElementById('mainVideo');
        const placeholderDiv = document.getElementById('videoPlaceholder');
        const spinner = document.getElementById('loaderSpinner');
        const currentTitle = document.getElementById('currentChannelTitle');
        const currentCatSpan = document.getElementById('currentChannelCat');

        function getIconClass(group) {
            const map = {
                "Bangla": "fa-tv", "News": "fa-newspaper", "Sports": "fa-futbol",
                "Indian Bangla": "fa-star", "Hindi": "fa-language", "English": "fa-globe",
                "Kids": "fa-child", "Music": "fa-music", "Movies": "fa-film",
                "Entertainment": "fa-smile", "Religious": "fa-mosque", "Documentary": "fa-book",
                "Weather": "fa-cloud-sun", "Others": "fa-ellipsis-h"
            };
            return map[group] || "fa-tv";
        }

        function playChannel(channel) {
            if (!channel || !channel.url) return;
            activeChannel = channel;
            currentTitle.innerText = channel.name;
            currentCatSpan.innerText = (groupMap[channel.group]?.label || channel.group) + ' • ' + (channel.group || '');
            if (hlsInstance) hlsInstance.destroy();
            spinner.style.display = 'block';
            placeholderDiv.style.display = 'flex';
            placeholderDiv.innerHTML = '<i class="fas fa-tv" style="font-size:36px;"></i><h3>লোড হচ্ছে...</h3><div id="loaderSpinner" class="spinner" style="display:block;"></div>';
            video.pause();
            video.removeAttribute('src');

            const url = channel.url;
            if (Hls.isSupported()) {
                const hls = new Hls({ enableWorker: true, lowLatencyMode: false });
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    spinner.style.display = 'none';
                    placeholderDiv.style.display = 'none';
                    video.play().catch(() => {});
                });
                hls.on(Hls.Events.ERROR, (_, data) => {
                    if (data.fatal) {
                        spinner.style.display = 'none';
                        placeholderDiv.innerHTML = '<i class="fas fa-exclamation-triangle" style="font-size:36px;color:#f0a500;"></i><h3>স্ট্রিম লোড হয়নি</h3><p style="font-size:12px;opacity:0.7;">অন্য চ্যানেল চেষ্টা করুন</p>';
                        placeholderDiv.style.display = 'flex';
                        hls.destroy();
                    }
                });
                hlsInstance = hls;
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
                video.addEventListener('loadedmetadata', () => {
                    spinner.style.display = 'none';
                    placeholderDiv.style.display = 'none';
                    video.play();
                }, { once: true });
                video.addEventListener('error', () => {
                    spinner.style.display = 'none';
                    placeholderDiv.innerHTML = '<i class="fas fa-exclamation-triangle" style="font-size:36px;color:#f0a500;"></i><h3>স্ট্রিম লোড হয়নি</h3>';
                    placeholderDiv.style.display = 'flex';
                }, { once: true });
            } else {
                spinner.style.display = 'none';
                placeholderDiv.innerHTML = '<i class="fas fa-exclamation-circle"></i> HLS সমর্থিত নয়';
                placeholderDiv.style.display = 'flex';
            }
            renderAvailableGrid();
            setTimeout(() => {
                const activeEl = document.querySelector('.channel-card.active');
                if (activeEl) activeEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 100);
        }

        let currentFilterGroup = null;

        function renderAvailableGrid() {
            const grid = document.getElementById('availableChannelsGrid');
            const channelsToShow = currentFilterGroup ? (groupedChannels[currentFilterGroup] || []) : allChannels;
            let html = '';
            channelsToShow.forEach(ch => {
                const isActive = activeChannel && activeChannel.name === ch.name && activeChannel.url === ch.url;
                const hasLogo = ch.logo && ch.logo.trim() !== '';
                html += `<div class="channel-card ${isActive ? 'active' : ''}" data-name="${ch.name}" data-url="${ch.url}" data-group="${ch.group}">
                    <div class="channel-icon-small">
                        ${hasLogo ? `<img src="${ch.logo}" alt="${ch.name}" onerror="this.parentElement.innerHTML='<i class=\\'fas ${getIconClass(ch.group)}\\'></i>'">` : `<i class="fas ${getIconClass(ch.group)}"></i>`}
                    </div>
                    <div><h4>${ch.name}</h4><span>${groupMap[ch.group]?.label || ch.group}</span></div>
                    <div class="live-dot-small"></div>
                </div>`;
            });
            grid.innerHTML = html;
            document.querySelectorAll('#availableChannelsGrid .channel-card').forEach(el => {
                el.addEventListener('click', () => {
                    const name = el.getAttribute('data-name');
                    const url = el.getAttribute('data-url');
                    const selected = allChannels.find(c => c.name === name && c.url === url);
                    if (selected) playChannel(selected);
                });
            });
        }

        function renderCategoryTabs() {
            const tabsContainer = document.getElementById('categoryTabs');
            let html = `<div class="cat-tab ${currentFilterGroup === null ? 'active' : ''}" data-group="">সব <span class="cat-count">${allChannels.length}</span></div>`;
            sortedGroups.forEach(g => {
                const chs = groupedChannels[g] || [];
                const info = groupMap[g] || { label: g, icon: 'fa-tv' };
                html += `<div class="cat-tab ${currentFilterGroup === g ? 'active' : ''}" data-group="${g}"><i class="fas ${info.icon}" style="margin-right:4px;"></i>${info.label} <span class="cat-count">${chs.length}</span></div>`;
            });
            tabsContainer.innerHTML = html;
            document.querySelectorAll('#categoryTabs .cat-tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    const group = tab.getAttribute('data-group');
                    currentFilterGroup = group || null;
                    renderCategoryTabs();
                    renderAvailableGrid();
                    tab.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                });
            });
        }

        // ======================= SPORTS VIEW =======================
        function renderSportsGrid() {

        // ======================= SEARCH =======================
        const searchInput = document.getElementById('searchInput');
        const searchResultsDiv = document.getElementById('searchResultsList');
        const flatChannelsForSearch = [...allChannels];

        function renderSearchResults(query) {
            const q = query.toLowerCase().trim();
            const filtered = q ? flatChannelsForSearch.filter(ch => ch.name.toLowerCase().includes(q)) : flatChannelsForSearch;
            if (filtered.length === 0) {
                searchResultsDiv.innerHTML = '<div style="padding:20px;text-align:center;color:#6c5a8a;">কোন চ্যানেল পাওয়া যায়নি</div>';
                return;
            }
            let html = '';
            const displayChannels = q ? filtered : filtered.slice(0, 50);
            displayChannels.forEach(ch => {
                const hasLogo = ch.logo && ch.logo.trim() !== '';
                html += `<div class="result-item" data-name="${ch.name}" data-url="${ch.url}" data-group="${ch.group}">
                    ${hasLogo ? `<img src="${ch.logo}" alt="${ch.name}" onerror="this.outerHTML='<i class=\\'fas ${getIconClass(ch.group)}\\' style=\\'width:28px;text-align:center;\\'></i>'">` : `<i class="fas ${getIconClass(ch.group)}" style="width:28px;text-align:center;"></i>`}
                    <span>${ch.name}</span>
                    <span style="margin-left:auto;font-size:10px;color:#8a75b2;">${groupMap[ch.group]?.label || ch.group}</span>
                </div>`;
            });
            if (!q && flatChannelsForSearch.length > 50) {
                html += `<div style="padding:12px;text-align:center;color:#9a86c9;font-size:12px;">আরও ${flatChannelsForSearch.length - 50}+ চ্যানেল - সার্চ করে খুঁজুন</div>`;
            }
            searchResultsDiv.innerHTML = html;
            document.querySelectorAll('#searchResultsList .result-item').forEach(el => {
                el.addEventListener('click', () => {
                    const name = el.getAttribute('data-name');
                    const url = el.getAttribute('data-url');
                    const selected = allChannels.find(c => c.name === name && c.url === url);
                    if (selected) {
                        playChannel(selected);
                        switchView('available');
                    }
                });
            });
        }
        searchInput.addEventListener('input', (e) => renderSearchResults(e.target.value));
        renderSearchResults('');

        // ======================= MODAL =======================
        const modal = document.getElementById('comingSoonModal');
        const modalChannelSpan = document.getElementById('modalChannelName');
        function showComingSoonModal(channelName) {
            modalChannelSpan.innerText = channelName;
            modal.style.display = 'flex';
        }
        function closeModal() { modal.style.display = 'none'; }
        document.getElementById('closeModalBtn').addEventListener('click', closeModal);
        window.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });

        // ======================= VIEW SWITCHING =======================
        const views = {
            available: document.getElementById('availableView'),
            search: document.getElementById('searchView'),
            upcoming: document.getElementById('upcomingView')
        };
        const navBtns = document.querySelectorAll('.nav-btn');
        function switchView(viewName) {
            Object.keys(views).forEach(v => views[v].classList.remove('active-view'));
            views[viewName].classList.add('active-view');
            navBtns.forEach(btn => {
                if (btn.getAttribute('data-view') === viewName) btn.classList.add('active');
                else btn.classList.remove('active');
            });
            if (viewName === 'available' && activeChannel) {
                video.play().catch(() => {});
                renderAvailableGrid();
                renderCategoryTabs();
            }
            if (viewName === 'search') {
                renderSearchResults(searchInput.value);
                setTimeout(() => searchInput.focus(), 300);
            }
            if (viewName === 'upcoming') {
                renderSportsGrid();
            }
        }
        navBtns.forEach(btn => btn.addEventListener('click', () => switchView(btn.getAttribute('data-view'))));

        // ======================= INIT =======================
        renderCategoryTabs();
        renderAvailableGrid();
        playChannel(allChannels[0]);
    </script>
</body>
</html>
